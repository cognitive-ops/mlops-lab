### model
model_name_or_path: bytedance-research/UI-TARS-7B-SFT
template: qwen2_vl
trust_remote_code: true
image_max_pixels: 1003520   # 28*28*1280, match smart_resize in convert_data.py
freeze_vision_tower: true
freeze_multi_modal_projector: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
# QLoRA for ~24GB GPU: uncomment
# quantization_bit: 4

### dataset
dataset: uitars_train
dataset_dir: data
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: outputs/uitars7b-lora
logging_steps: 10
save_steps: 200
plot_loss: true
report_to: none   # or wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
