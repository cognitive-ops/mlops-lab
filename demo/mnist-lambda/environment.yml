name: mnist-lambda
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core ML/DL libraries
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - numpy>=1.24.0
  - pillow>=9.5.0

  # Experiment tracking and monitoring
  - wandb>=0.15.0

  # Data version control and pipeline
  - dvc>=3.0.0
  - pyyaml>=6.0

  # AWS deployment
  - boto3>=1.26.0

  # Development and testing
  - pytest>=7.0.0
  - black>=23.0.0
  - flake8>=6.0.0
  - jupyter>=1.0.0
  - matplotlib>=3.6.0
  - seaborn>=0.12.0

  # Infrastructure as Code (CDK)
  - pip
  - pip:
    - aws-cdk-lib>=2.80.0
    - constructs>=10.0.0

  # Additional utilities
  - requests>=2.28.0
  - click>=8.0.0

# Optional: specify prefix for environment location
# prefix: /path/to/envs/mnist-lambda