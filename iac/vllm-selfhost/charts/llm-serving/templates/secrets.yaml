# Syncs the gateway credentials from AWS Secrets Manager. ESO authenticates with
# its own EKS Pod Identity role (no static credentials in the cluster config).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secretName is required" .Values.secretName }}
