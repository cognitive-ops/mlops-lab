apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  # RWO volume + single GPU: old pod must release both before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        workload: llm-inference
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0-cu129
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve", "Qwen/Qwen2.5-7B-Instruct"]
          args:
            - --served-model-name
            - qwen2.5-7b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.9"
            - --tensor-parallel-size
            - "1"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            # g4dn (T4, no bf16) only: uncomment
            # - --dtype
            # - half
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            # Optional: only for gated repos.
            # kubectl -n vllm create secret generic hf-token --from-literal=HF_TOKEN=hf_xxx
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
            # Optional: require "Authorization: Bearer <key>" on /v1/*.
            # kubectl -n vllm create secret generic vllm-api-key --from-literal=VLLM_API_KEY=$(openssl rand -hex 24)
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: VLLM_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "3"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          # Image pull + model download + load can take 10+ min on first start (~20 min budget).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 80
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
