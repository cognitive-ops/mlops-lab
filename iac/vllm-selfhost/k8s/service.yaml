apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm
  annotations:
    # In-tree provisioning of an NLB (no AWS Load Balancer Controller needed).
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # Internal-only NLB in the VPC: uncomment
    # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    # Long generations stream for a while; raise the idle timeout (seconds).
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
spec:
  type: LoadBalancer
  selector:
    app: vllm
  # TODO: restrict to your IP(s) before applying
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  ports:
    - name: http
      port: 80
      targetPort: 8000
