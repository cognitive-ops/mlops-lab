apiVersion: v1
kind: Service
metadata:
  name: sglang
  namespace: sglang
  labels:
    app: sglang
  # Internal-only LB in the VNet: uncomment
  # annotations:
  #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: sglang
  # TODO: restrict to your IP(s) before applying
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  ports:
    - name: http
      port: 80
      targetPort: 30000
